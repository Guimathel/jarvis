<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jarvis</title>
<meta name="description" content="Jarvis, assistant personnel">
<meta name="theme-color" content="#0a0e14">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --bg: #0a0e14;
    --bg-2: #0e141d;
    --panel: #121a26;
    --panel-2: #172131;
    --line: #1f2c3f;
    --text: #e8eef6;
    --muted: #8696ab;
    --accent: #4fd1ff;
    --accent-2: #7c5cff;
    --danger: #ff6b7a;
    --ok: #4ade9b;
    --radius: 18px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(79,209,255,.07), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(124,92,255,.07), transparent 60%),
      var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    overscroll-behavior: none;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  [hidden] { display: none !important; }

  /* ---------- Écran de connexion ---------- */
  #login {
    min-height: 100dvh; display: grid; place-items: center;
    padding: calc(24px + var(--safe-top)) 24px calc(24px + var(--safe-bottom));
  }
  .login-card { width: min(380px, 100%); text-align: center; }
  .login-card h1 { margin: 18px 0 4px; font-size: 28px; letter-spacing: .02em; font-weight: 600; }
  .login-card p { margin: 0 0 26px; color: var(--muted); }
  .login-card form { display: grid; gap: 12px; text-align: left; }
  label { font-size: 13px; color: var(--muted); }
  input[type=email], input[type=password] {
    width: 100%; margin-top: 6px; padding: 14px 16px; border-radius: 14px;
    background: var(--panel); border: 1px solid var(--line); color: var(--text); font-size: 16px;
    outline: none; transition: border-color .15s, box-shadow .15s;
  }
  input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,209,255,.15); }
  .btn-primary {
    margin-top: 6px; padding: 14px 16px; border: 0; border-radius: 14px; font-weight: 600;
    color: #05222c; background: linear-gradient(135deg, var(--accent), #8be3ff);
    transition: transform .1s, opacity .15s;
  }
  .btn-primary:active { transform: scale(.98); }
  .btn-primary:disabled { opacity: .55; cursor: default; }
  .form-error { min-height: 20px; margin: 4px 0 0; color: var(--danger); font-size: 14px; text-align: center; }
  .login-note { margin-top: 22px !important; font-size: 13px; }

  /* ---------- Orbe ---------- */
  .orb {
    --size: 34px; width: var(--size); height: var(--size); border-radius: 50%; flex: none; position: relative;
    background: radial-gradient(circle at 35% 30%, #d9f6ff 0 6%, var(--accent) 28%, #1a6f93 62%, #0b2a3a 100%);
    box-shadow: 0 0 18px rgba(79,209,255,.45), inset 0 0 10px rgba(255,255,255,.18);
    animation: breathe 4.5s ease-in-out infinite;
  }
  .orb::after {
    content: ""; position: absolute; inset: -5px; border-radius: 50%;
    border: 1px solid rgba(79,209,255,.35);
  }
  .orb.big { --size: 76px; }
  .orb.thinking { animation-duration: 1.1s; }
  .orb.listening { animation-duration: 1.4s; background: radial-gradient(circle at 35% 30%, #fff 0 6%, #ff8da0 30%, #8a2a44 70%, #2a0c16 100%); box-shadow: 0 0 22px rgba(255,107,122,.55); }
  @keyframes breathe {
    0%, 100% { transform: scale(1); filter: brightness(1); }
    50% { transform: scale(1.06); filter: brightness(1.2); }
  }

  /* ---------- Application ---------- */
  #app { height: 100dvh; display: flex; flex-direction: column; }
  header {
    display: flex; align-items: center; gap: 12px; flex: none;
    padding: calc(10px + var(--safe-top)) 14px 10px;
    background: linear-gradient(to bottom, rgba(10,14,20,.96), rgba(10,14,20,.82));
    border-bottom: 1px solid var(--line); backdrop-filter: blur(10px);
  }
  .title { flex: 1; min-width: 0; }
  .title strong { display: block; font-size: 17px; font-weight: 600; letter-spacing: .02em; }
  .title span { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seg { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); }
  .seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 999px; font-size: 13px; color: var(--muted); }
  .seg button[aria-pressed=true] { background: var(--panel-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--panel); display: grid; place-items: center; flex: none; color: var(--text);
  }
  .icon-btn:active { background: var(--panel-2); }
  .icon-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  #menu {
    position: absolute; right: 12px; top: calc(60px + var(--safe-top)); z-index: 20; min-width: 240px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 6px;
    box-shadow: 0 18px 50px rgba(0,0,0,.55);
  }
  #menu button {
    display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 12px; border: 0; background: transparent; border-radius: 10px; text-align: left;
  }
  #menu button:hover, #menu button:active { background: var(--panel-2); }
  #menu .danger { color: var(--danger); }
  #menu small { color: var(--muted); }
  #menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 6px; }

  #chat { flex: 1; overflow-y: auto; padding: 18px 14px 8px; scroll-behavior: smooth; }
  .wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 88%; padding: 10px 14px; border-radius: var(--radius); word-wrap: break-word; overflow-wrap: anywhere; animation: pop .18s ease-out; }
  .msg.user { align-self: flex-end; background: linear-gradient(135deg, #1b3a55, #1a2f52); border: 1px solid #284a6b; border-bottom-right-radius: 6px; white-space: pre-wrap; }
  .msg.assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
  .msg.notice { align-self: center; max-width: 94%; background: transparent; border: 1px dashed var(--line); color: var(--muted); font-size: 14px; text-align: center; }
  .msg.error { align-self: center; color: var(--danger); border: 1px solid rgba(255,107,122,.4); background: rgba(255,107,122,.07); font-size: 14px; text-align: center; }
  .msg p { margin: 0 0 8px; } .msg p:last-child { margin-bottom: 0; }
  .msg ul { margin: 4px 0 8px; padding-left: 20px; } .msg li { margin: 2px 0; }
  .msg code { font: 14px ui-monospace, Menlo, Consolas, monospace; background: rgba(255,255,255,.07); padding: 1px 6px; border-radius: 6px; }
  .msg pre { margin: 6px 0; padding: 10px 12px; background: #0a1019; border: 1px solid var(--line); border-radius: 12px; overflow-x: auto; }
  .msg pre code { background: none; padding: 0; }
  .msg a { color: var(--accent); }
  .mem-note { align-self: flex-start; font-size: 12.5px; color: var(--ok); padding: 0 6px; }
  .sources { align-self: flex-start; max-width: 88%; font-size: 12.5px; color: var(--muted); padding: 0 6px; overflow-wrap: anywhere; }
  .sources a { color: var(--accent); text-decoration: none; }
  .sources a:hover { text-decoration: underline; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .typing { display: inline-flex; gap: 5px; padding: 14px 16px; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); opacity: .35; animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  .empty { margin: auto; text-align: center; padding: 30px 10px; display: grid; gap: 14px; justify-items: center; }
  .empty h2 { margin: 6px 0 0; font-size: 22px; font-weight: 600; }
  .empty p { margin: 0; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 6px; }
  .chip { padding: 9px 14px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-size: 14px; color: var(--text); }
  .chip:active { background: var(--panel-2); }

  footer { flex: none; padding: 8px 12px calc(10px + var(--safe-bottom)); background: linear-gradient(to top, var(--bg), rgba(10,14,20,.85)); }
  .composer { max-width: 760px; margin: 0 auto; display: flex; align-items: flex-end; gap: 8px; }
  textarea {
    flex: 1; resize: none; max-height: 160px; padding: 12px 16px; border-radius: 22px;
    background: var(--panel); border: 1px solid var(--line); color: var(--text); font: inherit; line-height: 1.4; outline: none;
  }
  .round { width: 46px; height: 46px; border-radius: 50%; border: 0; display: grid; place-items: center; flex: none; }
  .round svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  #mic { background: var(--panel); border: 1px solid var(--line); }
  #mic.on { background: rgba(255,107,122,.18); border-color: var(--danger); color: var(--danger); }
  #send { background: linear-gradient(135deg, var(--accent), #8be3ff); color: #05222c; }
  #send:disabled { opacity: .45; }

  /* ---------- Fenêtre « mémoire » ---------- */
  dialog { width: min(520px, calc(100% - 24px)); max-height: 80dvh; padding: 0; border: 1px solid var(--line); border-radius: 20px; background: var(--bg-2); color: var(--text); }
  dialog::backdrop { background: rgba(3,6,10,.7); backdrop-filter: blur(3px); }
  .dlg-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid var(--line); }
  .dlg-head h3 { margin: 0; font-size: 18px; font-weight: 600; }
  .dlg-body { padding: 8px 12px 14px; overflow-y: auto; max-height: calc(80dvh - 70px); }
  .mem { display: flex; gap: 10px; align-items: flex-start; padding: 10px 8px; border-bottom: 1px solid var(--line); }
  .mem:last-child { border-bottom: 0; }
  .mem span { flex: 1; }
  .mem button { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 6px 10px; color: var(--danger); font-size: 13px; }
  .dlg-empty { padding: 22px 10px; text-align: center; color: var(--muted); }
  .form-body { display: grid; gap: 12px; padding: 16px 18px 20px; }
  select {
    width: 100%; padding: 12px 14px; border-radius: 12px; background: var(--panel); color: var(--text);
    border: 1px solid var(--line); font: inherit; font-size: 16px; outline: none;
  }
  select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,209,255,.15); }
  select:disabled { opacity: .5; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .hint { margin: 0; color: var(--muted); font-size: 13px; }

  #toast {
    position: fixed; left: 50%; bottom: calc(86px + var(--safe-bottom)); transform: translateX(-50%); z-index: 50;
    max-width: 90%; padding: 10px 16px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line);
    font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.5);
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>

<!-- ======================= CONNEXION ======================= -->
<section id="login" hidden>
  <div class="login-card">
    <div class="orb big" style="margin: 0 auto"></div>
    <h1>Jarvis</h1>
    <p>Ton assistant personnel</p>
    <form id="login-form" autocomplete="on">
      <label>E-mail
        <input id="email" type="email" name="email" autocomplete="username" required>
      </label>
      <label>Mot de passe
        <input id="password" type="password" name="password" autocomplete="current-password" required>
      </label>
      <button class="btn-primary" id="login-btn" type="submit">Se connecter</button>
      <p class="form-error" id="login-error" role="alert"></p>
    </form>
    <p class="login-note">Accès sur invitation uniquement.</p>
  </div>
</section>

<!-- ======================= APPLICATION ======================= -->
<main id="app" hidden>
  <header>
    <div class="orb" id="orb" aria-hidden="true"></div>
    <div class="title">
      <strong>Jarvis</strong>
      <span id="usage">&nbsp;</span>
    </div>
    <div class="seg" role="group" aria-label="Mode de réflexion">
      <button type="button" id="mode-rapide" aria-pressed="true" title="Réponses rapides (Haiku)">Rapide</button>
      <button type="button" id="mode-approfondi" aria-pressed="false" title="Réflexion approfondie (Sonnet)">Approfondi</button>
    </div>
    <button class="icon-btn" id="menu-btn" aria-label="Menu" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="19" r="1.2"/></svg>
    </button>
  </header>

  <div id="menu" role="menu" hidden>
    <button id="m-memory" role="menuitem">Mémoire de Jarvis <small>›</small></button>
    <button id="m-tts" role="menuitem">Lecture vocale <small id="m-tts-state">désactivée</small></button>
    <button id="m-wake" role="menuitem">Mode écoute « Hey Jarvis » <small id="m-wake-state">désactivé</small></button>
    <button id="m-auto" role="menuitem">Écouter dès l'ouverture <small id="m-auto-state">désactivé</small></button>
    <button id="m-voice" role="menuitem">Voix de Jarvis <small>›</small></button>
    <button id="m-install" role="menuitem" hidden>Installer sur cet appareil <small>↓</small></button>
    <hr>
    <button id="m-clear" role="menuitem" class="danger">Effacer la conversation</button>
    <button id="m-logout" role="menuitem">Se déconnecter</button>
  </div>

  <div id="chat" aria-live="polite"><div class="wrap" id="wrap"></div></div>

  <footer>
    <form class="composer" id="composer" autocomplete="off">
      <button type="button" class="round" id="mic" aria-label="Dicter" hidden>
        <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <textarea id="input" rows="1" placeholder="Écris à Jarvis…" aria-label="Message" enterkeyhint="send"></textarea>
      <button type="submit" class="round" id="send" aria-label="Envoyer">
        <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </form>
  </footer>
</main>

<dialog id="memory-dialog">
  <div class="dlg-head">
    <h3>Ce que Jarvis retient</h3>
    <button class="icon-btn" id="memory-close" aria-label="Fermer">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="dlg-body" id="memory-list"></div>
</dialog>

<dialog id="voice-dialog">
  <div class="dlg-head">
    <h3>Voix de Jarvis</h3>
    <button class="icon-btn" id="voice-close" aria-label="Fermer">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="form-body">
    <label for="voice-select">Voix</label>
    <select id="voice-select"></select>
    <label for="voice-rate">Vitesse : <span id="voice-rate-val">1,0×</span></label>
    <input id="voice-rate" type="range" min="0.7" max="1.4" step="0.05" value="1">
    <label for="voice-pitch">Hauteur : <span id="voice-pitch-val">normale</span></label>
    <input id="voice-pitch" type="range" min="0.5" max="1.5" step="0.05" value="1">
    <button type="button" class="btn-primary" id="voice-test">Écouter un exemple</button>
    <p class="hint" id="voice-hint"></p>
  </div>
</dialog>

<div id="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";

/* ============================================================
   CONFIGURATION — ces deux valeurs sont publiques par conception
   (la sécurité repose sur les règles de la base, pas sur leur secret).
   ============================================================ */
const CONFIG = {
  SUPABASE_URL: "https://qcmfubynjidftonhrldt.supabase.co",
  SUPABASE_KEY: "sb_publishable_M9MRnq1rsD7WQ5Ors-8BOg_DVqandAa",
};
CONFIG.FUNCTION_NAME = "hyper-processor"; // nom (slug) de la fonction créée dans Supabase
CONFIG.FUNCTION_URL = CONFIG.SUPABASE_URL + "/functions/v1/" + CONFIG.FUNCTION_NAME;

const $ = (id) => document.getElementById(id);
const sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false },
});

/* ---------- Petites aides ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch { /* stockage indisponible */ } },
};

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* Rendu minimal et sûr : on échappe tout d'abord, puis on ajoute gras, code, listes, liens. */
function renderText(text) {
  const blocks = [];
  let h = esc(text).replace(/```[a-zA-Z]*\n?([\s\S]*?)```/g, (_, code) => {
    blocks.push("<pre><code>" + code.replace(/\n$/, "") + "</code></pre>");
    return "\u0000" + (blocks.length - 1) + "\u0000";
  });
  const inline = (s) => s
    .replace(/`([^`\n]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)\]])/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');

  const out = [];
  let list = null;
  let para = [];
  const flushPara = () => { if (para.length) { out.push("<p>" + para.join("<br>") + "</p>"); para = []; } };
  const flushList = () => { if (list) { out.push("<ul>" + list.map((li) => "<li>" + li + "</li>").join("") + "</ul>"); list = null; } };

  for (const line of h.split("\n")) {
    const bullet = line.match(/^\s*[-*•]\s+(.*)$/);
    if (/^\u0000\d+\u0000$/.test(line.trim())) { flushPara(); flushList(); out.push(line.trim()); }
    else if (bullet) { flushPara(); (list = list || []).push(inline(bullet[1])); }
    else if (!line.trim()) { flushPara(); flushList(); }
    else { flushList(); para.push(inline(line)); }
  }
  flushPara(); flushList();
  return out.join("").replace(/\u0000(\d+)\u0000/g, (_, i) => blocks[Number(i)]);
}

let toastTimer;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 3200);
}

/* ---------- État ---------- */
let session = null;
let profile = null;
let busy = false;
let mode = store.get("jarvis.mode", "rapide") === "approfondi" ? "approfondi" : "rapide";
let ttsOn = store.get("jarvis.tts", "0") === "1";
let installEvent = null;

/* ---------- Affichage ---------- */
function showLogin() { $("login").hidden = false; $("app").hidden = true; }
function showApp() { $("login").hidden = true; $("app").hidden = false; }

function scrollDown() { const c = $("chat"); c.scrollTop = c.scrollHeight; }

function addMessage(role, text) {
  const wrap = $("wrap");
  removeEmpty();
  const el = document.createElement("div");
  el.className = "msg " + role;
  if (role === "assistant") el.innerHTML = renderText(text); else el.textContent = text;
  if (role === "notice" || role === "error") el.textContent = text;
  wrap.appendChild(el);
  scrollDown();
  return el;
}

function addMemNote(changes) {
  if (!changes || !changes.length) return;
  const el = document.createElement("div");
  el.className = "mem-note";
  el.textContent = changes.map((c) => (c.startsWith("+") ? "✓ Retenu : " : "✕ Oublié : ") + c.slice(2)).join("  ·  ");
  $("wrap").appendChild(el);
  scrollDown();
}

function addSources(list) {
  if (!Array.isArray(list)) return;
  const seen = new Set();
  const items = [];
  for (const s of list) {
    if (!s || typeof s.url !== "string" || !/^https?:\/\//i.test(s.url)) continue;
    let host = s.url;
    try { host = new URL(s.url).hostname.replace(/^www\./, ""); } catch { continue; }
    if (seen.has(host)) continue;
    seen.add(host);
    items.push({ host, url: s.url, title: s.title || host });
  }
  if (!items.length) return;
  const el = document.createElement("div");
  el.className = "sources";
  el.append("Sources : ");
  items.forEach((it, i) => {
    if (i) el.append(" · ");
    const a = document.createElement("a");
    a.href = it.url; a.target = "_blank"; a.rel = "noopener noreferrer";
    a.textContent = it.host; a.title = it.title;
    el.append(a);
  });
  $("wrap").appendChild(el);
  scrollDown();
}

function showTyping() {
  const el = document.createElement("div");
  el.className = "msg assistant typing";
  el.id = "typing";
  el.innerHTML = "<i></i><i></i><i></i>";
  $("wrap").appendChild(el);
  scrollDown();
}
function hideTyping() { const t = $("typing"); if (t) t.remove(); }

function removeEmpty() { const e = $("empty"); if (e) e.remove(); }

function showEmpty() {
  const name = profile && profile.display_name ? profile.display_name : "";
  const el = document.createElement("div");
  el.className = "empty";
  el.id = "empty";
  el.innerHTML =
    '<div class="orb big"></div>' +
    "<h2>Bonjour" + (name ? " " + esc(name) : "") + ".</h2>" +
    "<p>Je t'écoute.</p>" +
    '<div class="chips"></div>';
  const chips = el.querySelector(".chips");
  ["Que peux-tu faire pour moi ?", "Retiens que…", "Aide-moi à organiser ma journée"].forEach((t) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = t;
    b.addEventListener("click", () => { $("input").value = t.endsWith("…") ? t.slice(0, -1) + " " : t; $("input").focus(); autosize(); });
    chips.appendChild(b);
  });
  $("wrap").appendChild(el);
}

const usageState = { used: null, limit: null, sUsed: null, sLimit: null };
function setUsage(used, limit, sUsed, sLimit) {
  if (used != null) usageState.used = used;
  if (limit != null) usageState.limit = limit;
  if (sUsed != null) usageState.sUsed = sUsed;
  if (sLimit != null) usageState.sLimit = sLimit;
  const s = usageState, parts = [], full = [];
  if (s.used != null && s.limit != null) { parts.push(s.used + "/" + s.limit + " msg"); full.push(s.used + " messages sur " + s.limit); }
  if (s.sUsed != null && s.sLimit != null) { parts.push(s.sUsed + "/" + s.sLimit + " web"); full.push(s.sUsed + " recherches web sur " + s.sLimit); }
  $("usage").textContent = parts.length ? parts.join(" · ") : " ";
  $("usage").title = full.length ? "Aujourd'hui : " + full.join(", ") : "";
}

function setOrb(state) {
  const o = $("orb");
  o.classList.toggle("thinking", state === "thinking");
  o.classList.toggle("listening", state === "listening");
}

function applyMode() {
  $("mode-rapide").setAttribute("aria-pressed", String(mode === "rapide"));
  $("mode-approfondi").setAttribute("aria-pressed", String(mode === "approfondi"));
}
function applyTts() { $("m-tts-state").textContent = ttsOn ? "activée" : "désactivée"; }

/* ---------- Chargement des données ---------- */
function todayParis() {
  return new Intl.DateTimeFormat("sv-SE", { timeZone: "Europe/Paris" }).format(new Date());
}

async function loadApp() {
  showApp();
  $("wrap").innerHTML = "";
  const uid = session.user.id;

  const [p, u, m] = await Promise.all([
    sb.from("profiles").select("*").eq("id", uid).maybeSingle(),
    sb.from("usage_daily").select("*").eq("user_id", uid).eq("day", todayParis()).maybeSingle(),
    sb.from("messages").select("role, content").eq("user_id", uid).order("created_at", { ascending: false }).limit(40),
  ]);

  profile = p.data || { display_name: "", daily_limit: null };
  setUsage(u.data ? u.data.requests : 0, profile.daily_limit,
           u.data && u.data.searches != null ? u.data.searches : (profile.daily_search_limit != null ? 0 : null),
           profile.daily_search_limit);

  const rows = (m.data || []).slice().reverse();
  if (!rows.length) showEmpty();
  rows.forEach((r) => addMessage(r.role, r.content));
  if (p.error || m.error) addMessage("error", "Certaines données n'ont pas pu être chargées. Vérifie la connexion.");
  scrollDown();
  // Option « écouter dès l'ouverture » : le micro ne s'allume qu'au lancement de l'appli.
  if (store.get("jarvis.autolisten", "0") === "1" && SR && !autoListened) {
    autoListened = true;
    setTimeout(startListening, 600);
  }
}
let autoListened = false;

/* ---------- Voix : lecture ---------- */
function speakable(text) {
  return text.replace(/```[\s\S]*?```/g, " ").replace(/https?:\/\/\S+/g, " lien ").replace(/[*`#_]/g, "");
}
function stopSpeaking() { try { if ("speechSynthesis" in window) speechSynthesis.cancel(); } catch { /* rien */ } }
let voiceURI = store.get("jarvis.voice", "");
let voiceRate = Math.min(1.4, Math.max(0.7, parseFloat(store.get("jarvis.rate", "1")) || 1));
let voicePitch = Math.min(1.5, Math.max(0.5, parseFloat(store.get("jarvis.pitch", "1")) || 1));
function pitchLabel(p) {
  if (p < 0.8) return "très grave";
  if (p < 0.95) return "grave";
  if (p <= 1.05) return "normale";
  if (p <= 1.2) return "un peu aiguë";
  return "aiguë";
}

function frenchVoices() {
  try {
    return speechSynthesis.getVoices().filter((v) => v.lang && v.lang.toLowerCase().replace("_", "-").startsWith("fr"));
  } catch { return []; }
}
function pickVoice() {
  const list = frenchVoices();
  return list.find((v) => v.voiceURI === voiceURI) || list[0] || null;
}
function speakRaw(text) {
  if (!("speechSynthesis" in window)) return;
  try {
    wakePause();   // le micro ne doit pas écouter la voix de Jarvis
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "fr-FR";
    u.rate = voiceRate;
    u.pitch = voicePitch;
    const v = pickVoice();
    if (v) { u.voice = v; u.lang = v.lang; }
    speechSynthesis.speak(u);
  } catch { /* synthèse indisponible */ }
}
function speak(text) { if (ttsOn) speakRaw(speakable(text)); }

/* ---------- Voix : réglages ---------- */
const SAMPLE = "Bonjour, je suis Jarvis. Voici ma voix.";
function fillVoices() {
  const sel = $("voice-select"), list = frenchVoices();
  sel.innerHTML = "";
  if (!list.length) {
    sel.disabled = true;
    const o = document.createElement("option"); o.textContent = "Aucune voix française trouvée"; sel.appendChild(o);
    $("voice-hint").textContent = "Sur Android : Réglages → Langue et saisie (ou Accessibilité) → Synthèse vocale, puis installe les données vocales françaises.";
    return;
  }
  sel.disabled = false;
  list.forEach((v) => {
    const o = document.createElement("option");
    o.value = v.voiceURI;
    o.textContent = v.name + (v.localService ? "" : " (en ligne)");
    sel.appendChild(o);
  });
  const cur = pickVoice();
  if (cur) sel.value = cur.voiceURI;
  $("voice-hint").textContent = "Les voix proposées dépendent de ton appareil. La lecture vocale s'active dans le menu.";
}
function openVoice() {
  closeMenu();
  if (!("speechSynthesis" in window)) { toast("Lecture vocale non prise en charge ici."); return; }
  fillVoices();
  $("voice-rate").value = String(voiceRate);
  $("voice-rate-val").textContent = voiceRate.toFixed(2).replace(/0$/, "").replace(".", ",") + "×";
  $("voice-pitch").value = String(voicePitch);
  $("voice-pitch-val").textContent = pitchLabel(voicePitch);
  $("voice-dialog").showModal();
}

/* ---------- Envoi d'un message ---------- */
async function send(text, fromVoice) {
  text = text.trim();
  if (!text || busy) return;
  busy = true;
  stopSpeaking();
  $("send").disabled = true;
  addMessage("user", text);
  $("input").value = ""; autosize();
  showTyping(); setOrb("thinking");

  try {
    const { data } = await sb.auth.getSession();
    if (!data.session) throw Object.assign(new Error("auth"), { code: 401 });
    session = data.session;

    const res = await fetch(CONFIG.FUNCTION_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + session.access_token,
        "apikey": CONFIG.SUPABASE_KEY,
      },
      body: JSON.stringify({ message: text, mode }),
    });
    let payload = {};
    try { payload = await res.json(); } catch { /* corps vide */ }
    hideTyping();

    if (res.status === 401) { await sb.auth.signOut(); return; }
    if (!res.ok) {
      addMessage(res.status === 429 ? "notice" : "error", payload.error || "Une erreur est survenue (" + res.status + ").");
      if (payload.used != null) setUsage(payload.used, payload.limit);
      if (res.status !== 429) { $("input").value = text; autosize(); }
      return;
    }
    addMessage("assistant", payload.reply);
    addSources(payload.sources);
    addMemNote(payload.memory_changes);
    setUsage(payload.used, payload.limit, payload.searches_today, payload.search_limit);
    speak(payload.reply);
  } catch (e) {
    hideTyping();
    if (e && e.code === 401) { await sb.auth.signOut(); return; }
    addMessage("error", "Impossible de joindre Jarvis. Vérifie ta connexion internet.");
    $("input").value = text; autosize();
  } finally {
    busy = false; $("send").disabled = false; setOrb(null);
    if (!fromVoice) $("input").focus();
  }
}

/* ---------- Voix : dictée ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recog = null, listening = false, heard = "";

function setupMic() {
  if (!SR) return;
  $("mic").hidden = false;
  $("mic").addEventListener("click", () => { listening ? recog.stop() : startListening(); });
}
function startListening() {
  if (busy) return;
  stopSpeaking();
  recog = new SR();
  recog.lang = "fr-FR"; recog.interimResults = true; recog.continuous = false; recog.maxAlternatives = 1;
  heard = "";
  recog.onstart = () => { listening = true; $("mic").classList.add("on"); setOrb("listening"); };
  recog.onresult = (e) => {
    let txt = "";
    for (let i = 0; i < e.results.length; i++) txt += e.results[i][0].transcript;
    heard = txt.trim();
    $("input").value = heard; autosize();
  };
  recog.onerror = (e) => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") toast("Autorise le micro pour dicter.");
    else if (e.error === "no-speech") toast("Je n'ai rien entendu.");
    else if (e.error !== "aborted") toast("Dictée indisponible (" + e.error + ").");
    heard = "";
  };
  recog.onend = () => {
    listening = false; $("mic").classList.remove("on"); setOrb(null);
    if (heard) { const t = heard; heard = ""; send(t, true); }
  };
  try { recog.start(); } catch { toast("Impossible de démarrer le micro."); }
}

/* ---------- Mode écoute « Hey Jarvis » ---------- */
// Chrome écoute en boucle ; seule une phrase contenant « Jarvis » est envoyée à Claude.
// La reconnaissance vocale est faite par le service de Chrome (aucun crédit Anthropic) ;
// le crédit n'est utilisé que lorsqu'une question est réellement envoyée.
const WAKE_RE = /\b(?:(?:hey|hé|eh|ok|salut|dis)\s+)?j[ae]rvi[sz]e?\b/i;
let wakeOn = store.get("jarvis.wake", "0") === "1";
let wakeRec = null, wakeActive = false, wakeHeard = "", wakeHold = 0, wakeLock = null;

function applyWake() { $("m-wake-state").textContent = wakeOn ? "activé" : "désactivé"; }
function wakePause() {
  wakeHeard = ""; wakeHold = Date.now() + 1500;
  try { if (wakeRec && wakeActive) wakeRec.abort(); } catch { /* rien */ }
}
function handleWake(t) {
  if (!wakeOn || !t) return;
  const m = WAKE_RE.exec(t);
  if (!m) return;
  const rest = t.slice(m.index + m[0].length).replace(/^[\s,.:;!?-]+/, "").trim();
  wakeHold = Date.now() + 2500;
  if (rest.length > 1) send(rest, true);
  else { toast("Je t'écoute…"); setTimeout(startListening, 150); }
}
function startWake() {
  wakeRec = new SR();
  wakeRec.lang = "fr-FR"; wakeRec.interimResults = true; wakeRec.continuous = false;
  wakeHeard = "";
  wakeRec.onstart = () => { wakeActive = true; };
  wakeRec.onresult = (e) => {
    let t = "";
    for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript;
    wakeHeard = t.trim();
  };
  wakeRec.onerror = (e) => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      wakeOn = false; store.set("jarvis.wake", "0"); applyWake(); setWakeLock(false);
      toast("Mode écoute désactivé : autorise le micro pour ce site.");
    }
  };
  wakeRec.onend = () => { wakeActive = false; const t = wakeHeard; wakeHeard = ""; handleWake(t); };
  try { wakeRec.start(); } catch { wakeActive = false; }
}
function wakeStep() {
  if (!wakeOn || !SR || wakeActive || busy || listening || !session || document.hidden) return;
  if (Date.now() < wakeHold) return;
  try { if (speechSynthesis.speaking) return; } catch { /* rien */ }
  if (document.querySelector("dialog[open]")) return;
  startWake();
}
async function setWakeLock(on) {
  try {
    if (on && "wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen");
    else if (wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch { /* écran non verrouillable */ }
}
document.addEventListener("visibilitychange", () => { if (wakeOn && !document.hidden) setWakeLock(true); });
setInterval(wakeStep, 1200);

/* ---------- Mémoire ---------- */
async function openMemory() {
  closeMenu();
  const list = $("memory-list");
  list.innerHTML = '<div class="dlg-empty">Chargement…</div>';
  $("memory-dialog").showModal();
  const { data, error } = await sb.from("memories").select("id, content").eq("user_id", session.user.id).order("created_at", { ascending: true });
  if (error) { list.innerHTML = '<div class="dlg-empty">Impossible de charger la mémoire.</div>'; return; }
  if (!data.length) { list.innerHTML = '<div class="dlg-empty">Rien pour l\'instant. Dis « retiens que… » à Jarvis.</div>'; return; }
  list.innerHTML = "";
  data.forEach((m) => {
    const row = document.createElement("div");
    row.className = "mem";
    const span = document.createElement("span"); span.textContent = m.content;
    const del = document.createElement("button"); del.type = "button"; del.textContent = "Oublier";
    del.addEventListener("click", async () => {
      const r = await sb.from("memories").delete().eq("id", m.id).eq("user_id", session.user.id);
      if (r.error) { toast("Suppression impossible."); return; }
      row.remove();
      if (!list.children.length) list.innerHTML = '<div class="dlg-empty">Mémoire vide.</div>';
    });
    row.append(span, del);
    list.appendChild(row);
  });
}

/* ---------- Menu ---------- */
function closeMenu() { $("menu").hidden = true; $("menu-btn").setAttribute("aria-expanded", "false"); }
function toggleMenu() {
  const open = $("menu").hidden;
  $("menu").hidden = !open;
  $("menu-btn").setAttribute("aria-expanded", String(open));
}

/* ---------- Saisie ---------- */
function autosize() {
  const t = $("input");
  t.style.height = "auto";
  t.style.height = Math.min(t.scrollHeight, 160) + "px";
}

/* ---------- Événements ---------- */
$("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = $("login-btn"), err = $("login-error");
  err.textContent = ""; btn.disabled = true; btn.textContent = "Connexion…";
  const { error } = await sb.auth.signInWithPassword({ email: $("email").value.trim(), password: $("password").value });
  btn.disabled = false; btn.textContent = "Se connecter";
  if (error) {
    err.textContent = /invalid login/i.test(error.message) ? "E-mail ou mot de passe incorrect." : "Connexion impossible : " + error.message;
  } else {
    $("password").value = "";
  }
});

$("composer").addEventListener("submit", (e) => { e.preventDefault(); send($("input").value, false); });
$("input").addEventListener("input", autosize);
$("input").addEventListener("keydown", (e) => {
  const touch = window.matchMedia("(pointer: coarse)").matches;
  if (e.key === "Enter" && !e.shiftKey && !touch && !e.isComposing) { e.preventDefault(); send($("input").value, false); }
});

$("mode-rapide").addEventListener("click", () => { mode = "rapide"; store.set("jarvis.mode", mode); applyMode(); });
$("mode-approfondi").addEventListener("click", () => { mode = "approfondi"; store.set("jarvis.mode", mode); applyMode(); });

$("menu-btn").addEventListener("click", (e) => { e.stopPropagation(); toggleMenu(); });
document.addEventListener("click", (e) => { if (!$("menu").hidden && !$("menu").contains(e.target)) closeMenu(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeMenu(); });

$("m-memory").addEventListener("click", openMemory);
$("memory-close").addEventListener("click", () => $("memory-dialog").close());
$("memory-dialog").addEventListener("click", (e) => { if (e.target === $("memory-dialog")) $("memory-dialog").close(); });

$("m-voice").addEventListener("click", openVoice);
$("voice-close").addEventListener("click", () => $("voice-dialog").close());
$("voice-dialog").addEventListener("click", (e) => { if (e.target === $("voice-dialog")) $("voice-dialog").close(); });
$("voice-dialog").addEventListener("close", stopSpeaking);
$("voice-select").addEventListener("change", () => {
  voiceURI = $("voice-select").value; store.set("jarvis.voice", voiceURI); speakRaw(SAMPLE);
});
$("voice-rate").addEventListener("input", () => {
  voiceRate = parseFloat($("voice-rate").value) || 1;
  store.set("jarvis.rate", String(voiceRate));
  $("voice-rate-val").textContent = voiceRate.toFixed(2).replace(/0$/, "").replace(".", ",") + "×";
});
$("voice-rate").addEventListener("change", () => speakRaw(SAMPLE));
$("voice-pitch").addEventListener("input", () => {
  voicePitch = parseFloat($("voice-pitch").value) || 1;
  store.set("jarvis.pitch", String(voicePitch));
  $("voice-pitch-val").textContent = pitchLabel(voicePitch);
});
$("voice-pitch").addEventListener("change", () => speakRaw(SAMPLE));
$("voice-test").addEventListener("click", () => speakRaw(SAMPLE));
if ("speechSynthesis" in window) {
  try {
    speechSynthesis.getVoices();   // déclenche le chargement des voix
    speechSynthesis.addEventListener("voiceschanged", () => { if ($("voice-dialog").open) fillVoices(); });
  } catch { /* rien */ }
}

$("m-tts").addEventListener("click", () => {
  ttsOn = !ttsOn; store.set("jarvis.tts", ttsOn ? "1" : "0"); applyTts();
  if (!ttsOn) stopSpeaking();
  else if ("speechSynthesis" in window) { try { speechSynthesis.getVoices(); } catch { /* rien */ } }
  else toast("Lecture vocale non prise en charge ici.");
});

$("m-wake").addEventListener("click", () => {
  if (!SR) { toast("Dictée vocale non prise en charge ici."); return; }
  wakeOn = !wakeOn; store.set("jarvis.wake", wakeOn ? "1" : "0"); applyWake(); setWakeLock(wakeOn);
  if (wakeOn) toast("Dis « Hey Jarvis » puis ta question. Garde l'écran allumé.");
  else { wakeHeard = ""; try { if (wakeRec) wakeRec.abort(); } catch { /* rien */ } }
});

function applyAuto() { $("m-auto-state").textContent = store.get("jarvis.autolisten", "0") === "1" ? "activé" : "désactivé"; }
$("m-auto").addEventListener("click", () => {
  if (!SR) { toast("Dictée vocale non prise en charge ici."); return; }
  const on = store.get("jarvis.autolisten", "0") !== "1";
  store.set("jarvis.autolisten", on ? "1" : "0"); applyAuto();
  if (on) toast("Jarvis écoutera dès qu'il s'ouvre.");
});

$("m-clear").addEventListener("click", async () => {
  closeMenu();
  if (!confirm("Effacer toute la conversation ? Les souvenirs de Jarvis sont conservés.")) return;
  const { error } = await sb.from("messages").delete().eq("user_id", session.user.id);
  if (error) { toast("Suppression impossible."); return; }
  $("wrap").innerHTML = ""; showEmpty();
});

$("m-logout").addEventListener("click", async () => { closeMenu(); stopSpeaking(); await sb.auth.signOut(); });

window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installEvent = e; $("m-install").hidden = false; });
$("m-install").addEventListener("click", async () => {
  closeMenu();
  if (!installEvent) return;
  installEvent.prompt();
  try { await installEvent.userChoice; } catch { /* rien */ }
  installEvent = null; $("m-install").hidden = true;
});

/* ---------- Démarrage ---------- */
let loadedFor = null;
sb.auth.onAuthStateChange((event, s) => {
  session = s;
  if (event === "SIGNED_OUT" || !s) { profile = null; loadedFor = null; showLogin(); return; }
  if ((event === "SIGNED_IN" || event === "INITIAL_SESSION") && loadedFor !== s.user.id) {
    loadedFor = s.user.id;
    // Différé : on ne fait pas d'appel Supabase directement dans ce rappel.
    setTimeout(loadApp, 0);
  }
});

applyMode(); applyTts(); setupMic(); applyWake(); applyAuto(); if (wakeOn) setWakeLock(true);
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
